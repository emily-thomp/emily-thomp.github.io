INHERIT: nav.yml

site_name: Emily's Notes
site_url: https://emily-thomp.github.io/
site_description: 通信、化工、机械、信息安全与人工智能技术文献
repo_url: https://github.com/emily-thomp/emily-thomp.github.io
repo_name: emily-thomp/emily-thomp.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.top
    - navigation.footer
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

exclude_docs: |
  writing.md

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          default: true
          name: zh - 简体中文
          build: true
        - locale: en
          name: en - English
          build: true
          site_description: Technical literature on communications, chemical engineering, mechanical engineering, information security and artificial intelligence
          nav_translations:
            首页: Home
            通信: Communications
            化工: Chemical Engineering
            机械: Mechanical Engineering
            信息安全: Information Security
            人工智能: Artificial Intelligence
            大模型意识形态对齐调查: Ideological alignment in open models
            概览: Overview
            氨氧化土法制硝酸: Nitric Acid Handbook
            01 概述与书籍信息: 01 Overview and front matter
            02 氨氧化法制硝酸: 02 Ammonia oxidation process
            03 生产系统的开停车: 03 Startup and shutdown
            04 生产控制分析方法: 04 Process-control analysis
            05 生产操作方法: 05 Operating methods
            06 技术经济指标: 06 Technical and economic indicators
            07 氨氧化触媒的制造: 07 Catalyst manufacture
            08 安全技术与劳动保护: 08 Safety and worker protection
          theme:
            palette:
              - scheme: default
                primary: teal
                accent: teal
                toggle:
                  icon: material/weather-night
                  name: Switch to dark mode
              - scheme: slate
                primary: teal
                accent: teal
                toggle:
                  icon: material/weather-sunny
                  name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/reading.css
