site_name: Emily's Notes
site_url: https://emily-thomp.github.io/
site_description: 学习、研究与实践笔记
repo_url: https://github.com/emily-thomp/emily-thomp.github.io
repo_name: emily-thomp/emily-thomp.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

nav:
  - 首页: index.md
  - 写作指南: writing.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
